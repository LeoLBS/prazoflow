<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PrazoFlow - Demandas</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/painel.css}">
</head>
<body class="bg-light">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Demandas</h1>
    <div class="d-flex gap-2">
        <a th:href="@{/painel}" class="btn btn-outline-secondary btn-sm">Início</a>
        <a th:href="@{/painel/tecnicos}" class="btn btn-outline-secondary btn-sm">Técnicos</a>
        <a th:href="@{/painel/demandas/nova}" class="btn btn-primary btn-sm">+ Nova demanda</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-secondary btn-sm">Sair</button>
        </form>
    </div>
</div>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}">Erro</div>
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}">Sucesso</div>
    <div th:if="${avisoNotificacao}" class="alert alert-warning" th:text="${avisoNotificacao}">Aviso</div>

    <div class="btn-group mb-3" role="group">
        <a th:href="@{/painel/demandas}"
           th:class="${statusSelecionado == null} ? 'btn btn-dark btn-sm' : 'btn btn-outline-dark btn-sm'">Todos</a>
        <a th:href="@{/painel/demandas(status='PENDENTE')}"
           th:class="${statusSelecionado != null and statusSelecionado.name() == 'PENDENTE'} ? 'btn btn-primary btn-sm' : 'btn btn-outline-primary btn-sm'">Pendente</a>
        <a th:href="@{/painel/demandas(status='ATRASADO')}"
           th:class="${statusSelecionado != null and statusSelecionado.name() == 'ATRASADO'} ? 'btn btn-danger btn-sm' : 'btn btn-outline-danger btn-sm'">Atrasado</a>
        <a th:href="@{/painel/demandas(status='CONCLUIDO')}"
           th:class="${statusSelecionado != null and statusSelecionado.name() == 'CONCLUIDO'} ? 'btn btn-success btn-sm' : 'btn btn-outline-success btn-sm'">Concluído</a>
        <a th:href="@{/painel/demandas(status='CANCELADO')}"
           th:class="${statusSelecionado != null and statusSelecionado.name() == 'CANCELADO'} ? 'btn btn-secondary btn-sm' : 'btn btn-outline-secondary btn-sm'">Cancelado</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover bg-white">
            <thead>
            <tr>
                <th>Título</th>
                <th>Técnico</th>
                <th>Prazo</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="demanda : ${pagina.content}">
                <td th:text="${demanda.titulo}">Título</td>
                <td>
                    <span th:if="${demanda.tecnico != null}" th:text="${demanda.tecnico.nome}">Técnico</span>
                    <span th:unless="${demanda.tecnico != null}" class="text-danger fw-semibold">Sem técnico</span>
                </td>
                <td th:text="${#temporals.format(demanda.dataVencimento, 'dd/MM/yyyy')}">Prazo</td>
                <td>
                    <span th:switch="${demanda.status.name()}" class="badge">
                        <span th:case="'PENDENTE'" class="badge bg-primary">Pendente</span>
                        <span th:case="'ATRASADO'" class="badge bg-danger">Atrasado</span>
                        <span th:case="'CONCLUIDO'" class="badge bg-success">Concluído</span>
                        <span th:case="'CANCELADO'" class="badge bg-secondary">Cancelado</span>
                    </span>
                </td>
                <td class="d-flex gap-2">
                    <a th:href="@{/painel/demandas/{id}/editar(id=${demanda.id})}"
                       class="btn btn-outline-secondary btn-sm">Editar</a>
                    <form th:if="${demanda.tecnico != null}"
                          th:action="@{/painel/demandas/{id}/reenviar-notificacao(id=${demanda.id})}" method="post">
                        <button type="submit" class="btn btn-outline-primary btn-sm">Reenviar notificação</button>
                    </form>
                    <th:block th:if="${demanda.status.name() == 'PENDENTE' or demanda.status.name() == 'ATRASADO'}">
                        <form th:action="@{/painel/demandas/{id}/concluir(id=${demanda.id})}" method="post">
                            <button type="submit" class="btn btn-outline-success btn-sm">Concluir</button>
                        </form>
                        <form th:action="@{/painel/demandas/{id}/cancelar(id=${demanda.id})}" method="post">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Cancelar</button>
                        </form>
                    </th:block>
                </td>
            </tr>
            <tr th:if="${pagina.empty}">
                <td colspan="5" class="text-center text-muted py-4">Nenhuma demanda encontrada.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
