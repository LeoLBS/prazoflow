<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PrazoFlow - Demandas</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/painel.css}">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Demandas</h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-secondary btn-sm">Sair</button>
        </form>
    </div>

    <div class="table-responsive">
        <table class="table table-hover bg-white">
            <thead>
            <tr>
                <th>Título</th>
                <th>Técnico</th>
                <th>Prazo</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="demanda : ${pagina.content}">
                <td th:text="${demanda.titulo}">Título</td>
                <td th:text="${demanda.tecnico != null ? demanda.tecnico.nome : '—'}">Técnico</td>
                <td th:text="${#temporals.format(demanda.dataVencimento, 'dd/MM/yyyy')}">Prazo</td>
                <td th:text="${demanda.status}">Status</td>
            </tr>
            <tr th:if="${pagina.empty}">
                <td colspan="4" class="text-center text-muted py-4">Nenhuma demanda cadastrada ainda.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
