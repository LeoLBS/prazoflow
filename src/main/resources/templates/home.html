<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PrazoFlow - Início</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/painel.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h1 class="h3 mb-0">PrazoFlow</h1>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-secondary btn-sm">Sair</button>
        </form>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <a th:href="@{/painel/demandas}" class="text-decoration-none">
                <div class="card p-4 shadow-sm bg-white h-100">
                    <h2 class="h4">Demandas</h2>
                    <p class="text-muted mb-0">Cadastrar, acompanhar prazos e status das demandas de documentação.</p>
                </div>
            </a>
        </div>
        <div class="col-md-6">
            <a th:href="@{/painel/tecnicos}" class="text-decoration-none">
                <div class="card p-4 shadow-sm bg-white h-100">
                    <h2 class="h4">Técnicos</h2>
                    <p class="text-muted mb-0">Cadastrar e gerenciar os técnicos responsáveis pelas demandas.</p>
                </div>
            </a>
        </div>
    </div>
</div>
</body>
</html>
