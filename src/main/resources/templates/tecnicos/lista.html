<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PrazoFlow - Técnicos</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/painel.css}">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Técnicos</h1>
        <div class="d-flex gap-2">
            <a th:href="@{/painel}" class="btn btn-outline-secondary btn-sm">Início</a>
            <a th:href="@{/painel/demandas}" class="btn btn-outline-secondary btn-sm">Demandas</a>
            <a th:href="@{/painel/tecnicos/novo}" class="btn btn-primary btn-sm">+ Novo técnico</a>
        </div>
    </div>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}">Erro</div>

    <div class="table-responsive">
        <table class="table table-hover bg-white">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Discord ID</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tecnico : ${pagina.content}">
                <td th:text="${tecnico.nome}">Nome</td>
                <td th:text="${tecnico.email}">Email</td>
                <td th:text="${tecnico.codigoIdDiscord} ?: '—'">Discord ID</td>
                <td th:text="${tecnico.status}">Status</td>
                <td class="d-flex gap-2">
                    <a th:href="@{/painel/tecnicos/{id}/editar(id=${tecnico.id})}"
                       class="btn btn-outline-secondary btn-sm">Editar</a>
                    <form th:action="@{/painel/tecnicos/{id}/status(id=${tecnico.id})}" method="post">
                        <button type="submit"
                                th:class="${tecnico.status.name() == 'ATIVO'} ? 'btn btn-outline-danger btn-sm' : 'btn btn-outline-success btn-sm'"
                                th:text="${tecnico.status.name() == 'ATIVO'} ? 'Inativar' : 'Reativar'">
                            Alternar status
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${pagina.empty}">
                <td colspan="5" class="text-center text-muted py-4">Nenhum técnico cadastrado ainda.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
