<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${idEdicao == null} ? 'PrazoFlow - Novo Técnico' : 'PrazoFlow - Editar Técnico'">PrazoFlow - Técnico</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/painel.css}">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="h3 mb-4" th:text="${idEdicao == null} ? 'Novo Técnico' : 'Editar Técnico'">Técnico</h1>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}">Erro</div>

    <form th:action="${idEdicao == null} ? @{/painel/tecnicos} : @{/painel/tecnicos/{id}/editar(id=${idEdicao})}"
          th:object="${tecnico}" method="post"
          class="card p-4 shadow-sm bg-white">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" th:field="*{nome}" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}">
        </div>

        <div class="mb-3">
            <label for="codigoIdDiscord" class="form-label">ID do Discord</label>
            <input type="text" class="form-control" id="codigoIdDiscord" th:field="*{codigoIdDiscord}">
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" th:text="${idEdicao == null} ? 'Salvar' : 'Atualizar'">Salvar</button>
            <a th:href="@{/painel/tecnicos}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
